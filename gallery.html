<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery – ACE-M</title>
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg:     #dedad5;
  --accent: #FF6B1A;
  --text:   #1a0f05;
  --muted:  #6b5a4e;
  --faint:  #9b8b80;
  --glass-bg:     linear-gradient(145deg, rgba(245,243,240,0.58) 0%, rgba(215,210,203,0.40) 100%);
  --glass-border: rgba(220,215,208,0.68);
  --glass-top:    rgba(255,255,255,0.78);
  --glass-btm:    rgba(26,15,5,0.05);
  --glass-blur:   blur(60px) saturate(140%) brightness(1.05);
}
html { scroll-behavior: smooth; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
}
.bg-canvas {
  position: fixed; inset: 0; z-index: 0;
  background:
    radial-gradient(ellipse 70% 60% at 85% 12%, rgba(255,107,26,0.22) 0%, transparent 60%),
    radial-gradient(ellipse 55% 50% at 10% 85%, rgba(255,160,90,0.14) 0%, transparent 58%),
    radial-gradient(ellipse 45% 40% at 55% 55%, rgba(255,210,170,0.09) 0%, transparent 55%),
    radial-gradient(ellipse 35% 30% at 20% 30%, rgba(255,180,110,0.08) 0%, transparent 50%),
    #dedad5;
}
.glass {
  background: var(--glass-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1.5px solid var(--glass-border);
  box-shadow: 0 6px 32px rgba(26,15,5,0.08), inset 0 1.5px 0 var(--glass-top), inset 0 -1px 0 var(--glass-btm);
}
.page {
  position: relative; z-index: 1;
  min-height: 100vh;
  padding: 0 32px 64px;
  max-width: 1000px;
  margin: 0 auto;
}
.nav-wrap {
  position: sticky; top: 0; z-index: 100;
  display: flex; justify-content: center;
  padding: 18px 0 0; pointer-events: none;
}
nav {
  pointer-events: all;
  display: flex; align-items: center; gap: 2px;
  padding: 5px 6px; border-radius: 28px;
  background: var(--glass-bg);
  backdrop-filter: blur(80px) saturate(160%) brightness(1.06);
  -webkit-backdrop-filter: blur(80px) saturate(160%) brightness(1.06);
  border: 1.5px solid var(--glass-border);
  box-shadow: 0 4px 24px rgba(26,15,5,0.1), inset 0 1.5px 0 var(--glass-top), inset 0 -1px 0 var(--glass-btm);
}
nav a {
  display: flex; align-items: center;
  padding: 7px 16px; border-radius: 22px;
  font-size: 13px; font-weight: 600; color: var(--muted);
  text-decoration: none; transition: all 0.2s; letter-spacing: -0.01em;
}
nav a:hover { color: var(--text); background: rgba(26,15,5,0.05); }
nav a.active { color: var(--accent); background: rgba(255,107,26,0.1); }

/* GALLERY HERO */
.gallery-hero {
  margin-top: 28px;
  border-radius: 26px;
  padding: 32px 40px;
  display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
}
.gallery-hero-title { font-size: clamp(28px, 4vw, 40px); font-weight: 800; letter-spacing: -0.05em; color: var(--text); }
.gallery-hero-sub { font-size: 14px; color: var(--muted); margin-top: 4px; }
.gallery-count {
  font-size: 32px; font-weight: 800; letter-spacing: -0.05em; color: var(--accent);
}
.gallery-count-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--faint); text-align: right; }

/* SECTION LABEL */
.section-label {
  font-size: 10px; font-weight: 800; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--faint); margin: 28px 0 12px;
}

/* GALLERY GRID */
.gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 12px;
}
.gallery-item {
  border-radius: 18px; overflow: hidden;
  aspect-ratio: 1;
  background: rgba(26,15,5,0.06);
  border: 1.5px solid var(--glass-border);
  cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
  position: relative;
}
.gallery-item:hover {
  transform: scale(1.02);
  box-shadow: 0 8px 32px rgba(26,15,5,0.12);
}
.gallery-item img {
  width: 100%; height: 100%; object-fit: cover; display: block;
}
.gallery-item .img-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(26,15,5,0.5) 0%, transparent 50%);
  opacity: 0; transition: opacity 0.2s;
  display: flex; align-items: flex-end; padding: 12px;
}
.gallery-item:hover .img-overlay { opacity: 1; }
.overlay-name { font-size: 12px; font-weight: 600; color: #fff; }

/* LOADING */
.gallery-loading {
  grid-column: 1 / -1; text-align: center; padding: 48px;
  color: var(--muted); font-size: 14px; font-weight: 600;
}
.gallery-empty {
  grid-column: 1 / -1; text-align: center; padding: 64px;
  color: var(--faint); font-size: 14px;
}

/* LIGHTBOX */
.lightbox {
  position: fixed; inset: 0; z-index: 1000;
  background: rgba(26,15,5,0.85);
  backdrop-filter: blur(12px);
  display: none; align-items: center; justify-content: center;
  padding: 32px;
}
.lightbox.open { display: flex; }
.lightbox-img {
  max-width: 90vw; max-height: 85vh;
  border-radius: 20px;
  box-shadow: 0 24px 80px rgba(26,15,5,0.5);
  object-fit: contain;
}
.lightbox-close {
  position: absolute; top: 24px; right: 24px;
  width: 44px; height: 44px; border-radius: 14px;
  background: rgba(255,255,255,0.15);
  border: 1.5px solid rgba(255,255,255,0.2);
  color: #fff; font-size: 20px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.2s;
}
.lightbox-close:hover { background: rgba(255,255,255,0.25); }

/* FOOTER */
.site-footer {
  border-radius: 20px; padding: 22px 26px;
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
  margin-top: 8px;
}
.footer-brand { font-size: 15px; font-weight: 800; letter-spacing: -0.03em; color: var(--text); }
.footer-copy { font-size: 11px; color: var(--faint); }
.social-links { display: flex; gap: 8px; }
.social-pill {
  display: inline-flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; border-radius: 12px;
  background: var(--glass-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1.5px solid var(--glass-border);
  box-shadow: 0 3px 12px rgba(26,15,5,0.07), inset 0 1px 0 var(--glass-top);
  color: var(--muted); text-decoration: none; transition: all 0.2s;
}
.social-pill:hover { color: var(--text); transform: translateY(-1px); box-shadow: 0 6px 18px rgba(26,15,5,0.10), inset 0 1px 0 var(--glass-top); }
.social-pill svg { width: 16px; height: 16px; }

@media (max-width: 700px) {
  .page { padding: 0 16px 48px; }
  .gallery-hero { padding: 24px 22px; }
  .gallery-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>

<script src="topo-bg.js"></script>
</head>
<body>
<div class="bg-canvas"></div>
<div class="page">

  <!-- NAV -->
  <div class="nav-wrap">
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      
      <a href="projects.html">Projects</a>
      <a href="tools.html">Tools</a>
      <a href="gallery.html" class="active">Gallery</a>
      <a href="travels.html">Travels</a>
      <a href="setup.html">Setup</a>
      
    </nav>
  </div>

  <!-- HERO -->
  <div class="gallery-hero glass">
    <div>
      <div class="gallery-hero-title">Gallery</div>
      <div class="gallery-hero-sub">Photos from travels, setups &amp; everyday life</div>
    </div>
    <div style="text-align:right">
      <div class="gallery-count" id="photo-count">–</div>
      <div class="gallery-count-label">Photos</div>
    </div>
  </div>

  <!-- GRID -->
  <p class="section-label">All Photos</p>
  <div class="gallery-grid" id="gallery-grid">
    <div class="gallery-loading">Loading photos…</div>
  </div>

  <!-- FOOTER -->
  <div class="site-footer glass">
    <div>
      <div class="footer-brand">ACE-M</div>
      <div class="footer-copy">© 2026 Mitchell Nesselaar</div>
    </div>
    <div class="social-links">
      <a href="https://instagram.com" target="_blank" class="social-pill" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><circle cx="12" cy="12" r="4"/>
          <circle cx="17.5" cy="6.5" r="0.5" fill="currentColor" stroke="none"/>
        </svg>
      </a>
      <a href="https://github.com/ULTIMATE-ACE-M" target="_blank" class="social-pill" aria-label="GitHub">
        <svg viewBox="0 0 24 24" fill="currentColor">

</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightbox-close">✕</button>
  <img class="lightbox-img" id="lightbox-img" src="" alt="">
</div>

<script>
var REPO = 'ULTIMATE-ACE-M/test';
var FOLDER = 'images';
var API = 'https://api.github.com/repos/' + REPO + '/contents/' + FOLDER;
var RAW = 'https://raw.githubusercontent.com/' + REPO + '/main/' + FOLDER + '/';

var grid = document.getElementById('gallery-grid');
var countEl = document.getElementById('photo-count');
var lightbox = document.getElementById('lightbox');
var lbImg = document.getElementById('lightbox-img');

fetch(API)
  .then(function(r){ return r.json(); })
  .then(function(files) {
    var imgs = files.filter(function(f){ return /\.(jpe?g|png|gif|webp|avif)$/i.test(f.name); });
    grid.innerHTML = '';
    countEl.textContent = imgs.length;
    if (!imgs.length) {
      grid.innerHTML = '<div class="gallery-empty">No photos yet.</div>';
      return;
    }
    imgs.forEach(function(f) {
      var url = RAW + encodeURIComponent(f.name);
      var item = document.createElement('div');
      item.className = 'gallery-item';
      item.innerHTML =
        '<img src="' + url + '" alt="' + f.name + '" loading="lazy">' +
        '<div class="img-overlay"><span class="overlay-name">' + f.name + '</span></div>';
      item.addEventListener('click', function() {
        lbImg.src = url;
        lightbox.classList.add('open');
      });
      grid.appendChild(item);
    });
  })
  .catch(function() {
    grid.innerHTML = '<div class="gallery-empty">Could not load photos. Check back later.</div>';
    countEl.textContent = '0';
  });

document.getElementById('lightbox-close').addEventListener('click', function() {
  lightbox.classList.remove('open');
  lbImg.src = '';
});
lightbox.addEventListener('click', function(e) {
  if (e.target === lightbox) { lightbox.classList.remove('open'); lbImg.src = ''; }
});
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') { lightbox.classList.remove('open'); lbImg.src = ''; }
});
</script>
</body>
</html>
