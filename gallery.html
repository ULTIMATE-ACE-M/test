<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Gallery - ACE-M</title>
<style>
*,::before,::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;min-height:100vh;background:#dedad5;color:#1a0f05;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 85% 65% at 12% 10%,rgba(255,110,20,.16) 0%,rgba(255,110,20,.06) 45%,transparent 72%),radial-gradient(ellipse 80% 70% at 88% 20%,rgba(255,80,0,.13) 0%,rgba(255,80,0,.04) 45%,transparent 70%),radial-gradient(ellipse 95% 75% at 50% 92%,rgba(255,130,40,.12) 0%,rgba(255,130,40,.04) 45%,transparent 68%)}
nav{position:sticky;top:0;z-index:100;backdrop-filter:blur(44px) saturate(250%) brightness(1.08);-webkit-backdrop-filter:blur(44px) saturate(250%) brightness(1.08);background:rgba(255,255,255,.28);border-bottom:1.5px solid rgba(255,255,255,.72);box-shadow:0 0 0 1px rgba(0,0,0,.06),0 2px 16px rgba(0,0,0,.08)}
.nav-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:58px;padding:0 2rem}
.nav-brand{font-size:1.15rem;font-weight:800;letter-spacing:-.5px;text-decoration:none;background:linear-gradient(135deg,#1a0f05 0%,#FF6B1A 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.nav-links{display:flex;gap:.25rem}
.nav-link{font-size:.88rem;font-weight:500;text-decoration:none;color:rgba(26,15,5,.7);padding:.38rem .95rem;border-radius:20px;border:1.5px solid transparent;transition:all .22s ease;position:relative;overflow:hidden}
.nav-link::after{content:'';position:absolute;inset:0;background:linear-gradient(130deg,rgba(255,255,255,0) 20%,rgba(255,255,255,.55) 50%,rgba(255,255,255,0) 80%);transform:translateX(-160%);transition:transform .4s ease;pointer-events:none;border-radius:inherit}
.nav-link:hover{background:rgba(255,255,255,.45);color:#1a0f05;border-color:rgba(255,255,255,.88);box-shadow:0 0 0 1px rgba(255,255,255,.28),0 3px 10px rgba(0,0,0,.1),inset 0 2px 0 rgba(255,255,255,1)}
.nav-link:hover::after{transform:translateX(160%)}
.nav-link.active{background:linear-gradient(180deg,rgba(255,255,255,.8) 0%,rgba(255,255,255,.04) 44%,rgba(255,255,255,.18) 100%);color:#FF6B1A;font-weight:600;border-color:rgba(255,255,255,.92);box-shadow:0 0 0 1px rgba(255,255,255,.28),0 4px 18px rgba(0,0,0,.08),inset 0 2px 0 rgba(255,255,255,1)}
.page{position:relative;z-index:1;padding:3rem 2rem 6rem;max-width:1100px;margin:0 auto}
.page-header{text-align:center;margin-bottom:2.5rem}
.page-title{font-size:clamp(2rem,5vw,3.5rem);font-weight:800;letter-spacing:-.03em;color:#1a0f05;margin-bottom:.75rem}
.page-sub{font-size:.95rem;color:rgba(26,15,5,.55)}
.upload-banner{background:linear-gradient(180deg,rgba(255,255,255,.8) 0%,rgba(255,255,255,.04) 44%,rgba(255,255,255,.18) 100%);backdrop-filter:blur(40px) saturate(220%);border:1.5px solid rgba(255,255,255,.92);border-bottom-color:rgba(255,255,255,.55);box-shadow:0 0 0 1px rgba(255,255,255,.28),0 8px 32px rgba(0,0,0,.08),inset 0 2px 0 rgba(255,255,255,1);border-radius:20px;padding:1.6rem 2rem;display:flex;align-items:center;justify-content:space-between;gap:1.5rem;margin-bottom:2.5rem;flex-wrap:wrap}
.banner-title{font-size:1rem;font-weight:700;color:#1a0f05;margin-bottom:.3rem}
.banner-sub{font-size:.82rem;color:rgba(26,15,5,.5)}
.banner-sub code{font-family:monospace;background:rgba(26,15,5,.07);padding:.1rem .35rem;border-radius:5px;font-size:.8rem}
.banner-actions{display:flex;gap:.6rem;flex-shrink:0;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:.45rem;font-size:.85rem;font-weight:600;padding:.52rem 1.2rem;border-radius:50px;border:1.5px solid rgba(255,255,255,.92);border-bottom-color:rgba(255,255,255,.55);cursor:pointer;transition:all .22s ease;text-decoration:none;white-space:nowrap;position:relative;overflow:hidden}
.btn-primary{background:linear-gradient(180deg,rgba(255,140,40,.28) 0%,rgba(255,88,10,.14) 100%);color:#FF6B1A;box-shadow:0 0 0 1px rgba(255,255,255,.28),0 4px 18px rgba(255,107,26,.18),inset 0 2px 0 rgba(255,210,140,.6)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 0 0 1px rgba(255,255,255,.35),0 8px 24px rgba(255,107,26,.28),inset 0 2px 0 rgba(255,210,140,.6)}
.btn-ghost{background:linear-gradient(180deg,rgba(255,255,255,.8) 0%,rgba(255,255,255,.04) 44%,rgba(255,255,255,.18) 100%);color:rgba(26,15,5,.65);box-shadow:0 0 0 1px rgba(255,255,255,.28),0 4px 14px rgba(0,0,0,.08),inset 0 2px 0 rgba(255,255,255,1)}
.btn-ghost:hover{transform:translateY(-2px);box-shadow:0 0 0 1px rgba(255,255,255,.35),0 8px 22px rgba(0,0,0,.1),inset 0 2px 0 rgba(255,255,255,1)}
.state-box{text-align:center;padding:4rem 2rem}
.state-icon{font-size:3rem;margin-bottom:1rem;opacity:.4}
.state-title{font-size:1.05rem;font-weight:600;color:rgba(26,15,5,.55);margin-bottom:.4rem}
.state-sub{font-size:.85rem;color:rgba(26,15,5,.35)}
.spinner{width:36px;height:36px;border:3px solid rgba(255,107,26,.2);border-top-color:#FF6B1A;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 1.2rem}
@keyframes spin{to{transform:rotate(360deg)}}
.count-row{display:flex;align-items:center;margin-bottom:1.2rem}
.count-badge{font-size:.82rem;font-weight:600;color:rgba(26,15,5,.45)}
.gallery-grid{columns:3 280px;gap:1.2rem}
.gallery-item{break-inside:avoid;margin-bottom:1.2rem;position:relative;border-radius:18px;overflow:hidden;cursor:pointer;background:rgba(255,255,255,.6);box-shadow:0 0 0 1px rgba(255,255,255,.28),0 8px 32px rgba(0,0,0,.08);transition:all .28s ease}
.gallery-item:hover{transform:translateY(-4px);box-shadow:0 0 0 1px rgba(255,255,255,.38),0 18px 52px rgba(0,0,0,.13)}
.gallery-item img{width:100%;height:auto;display:block;border-radius:18px}
.item-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(26,15,5,.55) 0%,transparent 50%);opacity:0;transition:opacity .25s ease;border-radius:18px;display:flex;align-items:flex-end;padding:.9rem 1rem}
.gallery-item:hover .item-overlay{opacity:1}
.item-name{font-size:.75rem;font-weight:500;color:rgba(255,255,255,.8);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lightbox{position:fixed;inset:0;z-index:1000;background:rgba(26,15,5,.9);backdrop-filter:blur(24px);display:none;align-items:center;justify-content:center;padding:2rem}
.lightbox.open{display:flex}
.lightbox-img{max-width:90vw;max-height:88vh;border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.5);object-fit:contain}
.lightbox-close{position:fixed;top:1.4rem;right:1.6rem;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.3);color:#fff;border-radius:50%;width:44px;height:44px;font-size:1.4rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s ease;z-index:1001}
.lightbox-close:hover{background:rgba(255,255,255,.25)}
.lightbox-nav{position:fixed;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.3);color:#fff;border-radius:50%;width:48px;height:48px;font-size:1.5rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s ease;z-index:1001}
.lightbox-nav:hover{background:rgba(255,255,255,.25)}
.lightbox-prev{left:1.2rem}
.lightbox-next{right:1.2rem}
.lightbox-caption{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:rgba(26,15,5,.6);backdrop-filter:blur(10px);color:rgba(255,255,255,.8);font-size:.8rem;padding:.4rem 1rem;border-radius:50px;border:1px solid rgba(255,255,255,.15)}
@media(max-width:600px){.gallery-grid{columns:2 140px}.upload-banner{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<nav>
  <div class="nav-inner">
    <a href="index.html" class="nav-brand">ACE-M</a>
    <div class="nav-links">
      <a href="index.html" class="nav-link">Home</a>
      <a href="status.html" class="nav-link">Status</a>
      <a href="about.html" class="nav-link">About me</a>
    </div>
  </div>
</nav>
<div class="page">
  <div class="page-header">
    <h1 class="page-title">Gallery</h1>
    <p class="page-sub">Photos stored in your GitHub repo</p>
  </div>
  <div class="upload-banner">
    <div class="banner-text">
      <div class="banner-title">Add photos</div>
      <div class="banner-sub">Drop images into the <code>images/</code> folder on GitHub &#8212; they appear here automatically.</div>
    </div>
    <div class="banner-actions">
      <a href="https://github.com/ULTIMATE-ACE-M/test/upload/main/images" target="_blank" class="btn btn-primary">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Upload Photos
      </a>
      <button class="btn btn-ghost" onclick="loadGallery()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        Refresh
      </button>
    </div>
  </div>
  <div id="state-loading" class="state-box"><div class="spinner"></div><div class="state-title">Loading photos...</div></div>
  <div id="state-empty" class="state-box" style="display:none"><div class="state-icon">&#128444;</div><div class="state-title">No photos yet</div><div class="state-sub">Click "Upload Photos" to add images</div></div>
  <div id="state-error" class="state-box" style="display:none"><div class="state-icon">&#9888;</div><div class="state-title">Could not load photos</div><div class="state-sub" id="error-msg"></div></div>
  <div id="gallery-wrap" style="display:none">
    <div class="count-row"><span class="count-badge" id="count-text"></span></div>
    <div class="gallery-grid" id="gallery-grid"></div>
  </div>
</div>
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" onclick="closeLightbox()">&#215;</button>
  <button class="lightbox-nav lightbox-prev" onclick="navLightbox(-1)">&#8249;</button>
  <img class="lightbox-img" id="lightbox-img" src="" alt=""/>
  <button class="lightbox-nav lightbox-next" onclick="navLightbox(1)">&#8250;</button>
  <div class="lightbox-caption" id="lightbox-caption"></div>
</div>
<script>
var REPO='ULTIMATE-ACE-M/test',FOLDER='images';
var API='https://api.github.com/repos/'+REPO+'/contents/'+FOLDER;
var IMG=/\.(jpe?g|png|gif|webp|avif|bmp|svg)$/i;
var images=[],lbIdx=0;
function show(id){['state-loading','state-empty','state-error','gallery-wrap'].forEach(function(s){document.getElementById(s).style.display=s===id?'':'none';});}
function loadGallery(){
  show('state-loading');
  fetch(API+'?t='+Date.now())
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .then(function(files){
      images=files.filter(function(f){return f.type==='file'&&IMG.test(f.name);});
      if(!images.length){show('state-empty');return;}
      renderGrid();show('gallery-wrap');
    })
    .catch(function(e){document.getElementById('error-msg').textContent=e.message||'Check your connection.';show('state-error');});
}
function renderGrid(){
  var g=document.getElementById('gallery-grid');g.innerHTML='';
  document.getElementById('count-text').textContent=images.length+' photo'+(images.length!==1?'s':'');
  images.forEach(function(img,i){
    var d=document.createElement('div');d.className='gallery-item';
    var el=document.createElement('img');el.src=img.download_url;el.alt=img.name;el.loading='lazy';
    var ov=document.createElement('div');ov.className='item-overlay';
    var nm=document.createElement('span');nm.className='item-name';nm.textContent=img.name;
    ov.appendChild(nm);d.appendChild(el);d.appendChild(ov);
    d.addEventListener('click',function(){openLightbox(i);});g.appendChild(d);
  });
}
function openLightbox(i){lbIdx=i;document.getElementById('lightbox-img').src=images[i].download_url;document.getElementById('lightbox-caption').textContent=images[i].name;document.getElementById('lightbox').classList.add('open');document.body.style.overflow='hidden';}
function closeLightbox(){document.getElementById('lightbox').classList.remove('open');document.getElementById('lightbox-img').src='';document.body.style.overflow='';}
function navLightbox(d){lbIdx=(lbIdx+d+images.length)%images.length;document.getElementById('lightbox-img').src=images[lbIdx].download_url;document.getElementById('lightbox-caption').textContent=images[lbIdx].name;}
document.addEventListener('keydown',function(e){var l=document.getElementById('lightbox');if(!l.classList.contains('open'))return;if(e.key==='Escape')closeLightbox();if(e.key==='ArrowRight')navLightbox(1);if(e.key==='ArrowLeft')navLightbox(-1);});
document.getElementById('lightbox').addEventListener('click',function(e){if(e.target===this)closeLightbox();});
loadGallery();
</script>
</body>
</html>
